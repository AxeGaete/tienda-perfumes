name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes: detecta vulnerabilidades nuevas aunque no haya cambios

permissions:
  contents: read

jobs:
  pruebas-y-auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de seguridad
        run: npm test
      - name: Auditoría de dependencias (producción)
        run: npm run audit:prod
